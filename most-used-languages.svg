<svg width="350" height="165" viewBox="0 0 350 165" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 700 18px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #7AA2F7; }
    .lang-name { font: 600 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #C0CAF5; }
    .lang-pct { font: 400 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #7DCFFF; }
  </style>

  <!-- Background Card (Tokyo Night) -->
  <rect width="350" height="165" rx="8" fill="#0D1117" stroke="#1F242C" stroke-width="1"/>

  <!-- Title -->
  <text x="25" y="34" class="header">Most Used Languages</text>

  <!-- Progress Bar (Full Bar - 300px total width) -->
  <g transform="translate(25, 52)">
    <rect width="300" height="8" rx="4" fill="#24283b"/>
    <!-- TypeScript (68.5% -> 205.5px) -->
    <rect width="205" height="8" rx="4" fill="#3178C6"/>
    <!-- Python (20.2% -> 60.6px) -->
    <rect x="205" width="60" height="8" rx="0" fill="#3776AB"/>
    <!-- JavaScript (8.3% -> 24.9px) -->
    <rect x="265" width="25" height="8" rx="0" fill="#F7DF1E"/>
    <!-- HTML/CSS (3.0% -> 9.0px) -->
    <rect x="290" width="10" height="8" rx="4" fill="#E34F26"/>
  </g>

  <!-- Language Legend Columns -->
  <!-- Row 1: TypeScript -->
  <circle cx="31" cy="90" r="5" fill="#3178C6"/>
  <text x="44" y="94" class="lang-name">TypeScript <tspan class="lang-pct">68.50%</tspan></text>

  <!-- Row 1: Python -->
  <circle cx="195" cy="90" r="5" fill="#3776AB"/>
  <text x="208" y="94" class="lang-name">Python <tspan class="lang-pct">20.20%</tspan></text>

  <!-- Row 2: JavaScript -->
  <circle cx="31" cy="126" r="5" fill="#F7DF1E"/>
  <text x="44" y="130" class="lang-name">JavaScript <tspan class="lang-pct">8.30%</tspan></text>

  <!-- Row 2: HTML/CSS -->
  <circle cx="195" cy="126" r="5" fill="#E34F26"/>
  <text x="208" y="130" class="lang-name">HTML/CSS <tspan class="lang-pct">3.00%</tspan></text>
</svg>
