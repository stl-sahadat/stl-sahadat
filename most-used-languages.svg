<svg width="350" height="165" viewBox="0 0 350 165" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #58a6ff; }
    .lang-name { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .lang-pct { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
  </style>

  <!-- Background Card (GitHub Dark Theme) -->
  <rect width="350" height="165" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Title -->
  <text x="25" y="34" class="header">Most Used Languages</text>

  <!-- Options Menu Icon (Top Right) -->
  <g transform="translate(315, 14)">
    <rect width="18" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="9" cy="6" r="1.2" fill="#8b949e"/>
    <circle cx="9" cy="10" r="1.2" fill="#8b949e"/>
    <circle cx="9" cy="14" r="1.2" fill="#8b949e"/>
  </g>

  <!-- Progress Bar (Full Bar - 300px total width) -->
  <g transform="translate(25, 52)">
    <clipPath id="bar-clip">
      <rect width="300" height="8" rx="4" />
    </clipPath>
    <rect width="300" height="8" rx="4" fill="#21262d"/>
    <g clip-path="url(#bar-clip)">
      <!-- TypeScript (68.20% -> 204.6px) -->
      <rect x="0" width="205" height="8" fill="#3178C6"/>
      <!-- Python (22.50% -> 67.5px) -->
      <rect x="205" width="67" height="8" fill="#3572A5"/>
      <!-- HTML (9.27% -> 27.8px) -->
      <rect x="272" width="27" height="8" fill="#E34C26"/>
      <!-- Procfile (0.03% -> 1px) -->
      <rect x="299" width="2" height="8" fill="#563D7C"/>
    </g>
  </g>

  <!-- Language Legend Columns -->
  <!-- Col 1: TypeScript (Top Left) -->
  <circle cx="31" cy="94" r="5" fill="#3178C6"/>
  <text x="44" y="98"><tspan class="lang-name">TypeScript</tspan> <tspan class="lang-pct">68.20%</tspan></text>

  <!-- Col 2: Python (Top Right) -->
  <circle cx="195" cy="94" r="5" fill="#3572A5"/>
  <text x="208" y="98"><tspan class="lang-name">Python</tspan> <tspan class="lang-pct">22.50%</tspan></text>

  <!-- Col 1: HTML (Bottom Left) -->
  <circle cx="31" cy="130" r="5" fill="#E34C26"/>
  <text x="44" y="134"><tspan class="lang-name">HTML</tspan> <tspan class="lang-pct">9.27%</tspan></text>

  <!-- Col 2: Procfile (Bottom Right) -->
  <circle cx="195" cy="130" r="5" fill="#563D7C"/>
  <text x="208" y="134"><tspan class="lang-name">Procfile</tspan> <tspan class="lang-pct">0.03%</tspan></text>
</svg>
